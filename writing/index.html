    <script>
  document.addEventListener("DOMContentLoaded", () => {
    const menuToggle = document.getElementById("menu-toggle");
    const mobileMenu = document.getElementById("mobile-menu");
    if (menuToggle && mobileMenu) {
      menuToggle.addEventListener("click", () => mobileMenu.classList.toggle("hidden"));
    }
  });
</script>

  <meta name="generator" content="Hexo 7.3.0"></head>

    <main class="writing-page">

    <script>
      document.querySelectorAll('.writing-filters button').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.writing-filters button').forEach(b => b.classList.remove('active'));
          button.classList.add('active');
          const filter = button.dataset.filter;
          document.querySelectorAll('.writing-item').forEach(item => {
            item.classList.toggle('is-hidden', filter !== 'all' && item.dataset.category !== filter);
          });
          document.querySelectorAll('.writing-year').forEach(section => {
            section.classList.toggle('is-hidden', !section.querySelector('.writing-item:not(.is-hidden)'));
          });
        });
      });
    </script>
